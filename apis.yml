name: MoreTickets
description: 'MoreTickets (摩天轮票务), operated by Shanghai Juqitech, is a next-generation
  internet performance ticketing marketplace founded in 2015. The platform lets consumers
  buy and sell tickets to concerts, stage plays, musicals, and sports events through
  a transparent, competitive pricing marketplace with standardized ticketing services.
  It operates primarily as a consumer-facing web and mobile marketplace and does not
  publish a public developer API or open platform. The company is backed by Qiming
  Venture Partners and has raised a reported $108M in funding.'
